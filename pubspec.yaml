name: employee_platform
description: Employee Management Platform - Shifts, Chat, Payroll
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Models & Code Generation
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Supabase
  supabase_flutter: ^2.5.0

  # Offline-first
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Functional Programming
  fpdart: ^1.1.0

  # UI
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1

  # Utils
  equatable: ^2.0.5
  intl: ^0.19.0
  logger: ^2.4.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Code Generation
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
